# Full training configuration for diarization with XEUS SSL
# Same structure as train_full.yaml but uses XEUS instead of WavLM
# XEUS is memory-heavy (large transformer). If OOM: use train_xeus_lowmem.yaml or set
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

# Runtime settings
num_device: 1
num_nodes: 1

# Path scaffold (run from egs3/ami_diar/diar)
recipe_dir: .
ami_manifests_dir: /raid/users/popcornell/AMI
data_dir: data/ami_lhotse
exp_tag: xeus_full_training
exp_dir: exp/${exp_tag}
stats_dir: ${exp_dir}/stats

# Create dataset: symlink AMI IHM cuts
create_dataset:
  func: egs3.ami_diar.diar.src.symlink_ami.symlink_ami_manifests
  source_dir: ${ami_manifests_dir}
  output_dir: ${data_dir}

# Dataset definition (DataOrganizer format)
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  train:
    - name: train
      dataset:
        _target_: egs3.ami_diar.diar.src.dataset.DiarizationDataset
        manifest_path: ${data_dir}/train_cuts.jsonl.gz
        chunk_duration: 15.0  # 15s to reduce attention memory (XEUS is large); 20s can OOM on 40GB
        chunk_shift: 5.0      # 10s shift = 5s overlap
        frame_shift: 0.02
        max_speakers: 4
        sample_rate: 16000
  valid:
    - name: valid
      dataset:
        _target_: egs3.ami_diar.diar.src.dataset.DiarizationDataset
        manifest_path: ${data_dir}/dev_cuts.jsonl.gz
        chunk_duration: 15.0   # Match training chunk size
        chunk_shift: 10.0
        frame_shift: 0.02
        max_speakers: 4
        sample_rate: 16000

# DataLoader settings
dataloader:
  collate_fn:
    _target_: egs3.ami_diar.diar.src.dataset.CollateFnWrapper
  train:
    iter_factory: null
    batch_size: 2
    shuffle: true
    num_workers: 4
    pin_memory: true
    drop_last: true
  valid:
    iter_factory: null
    batch_size: 2
    shuffle: false
    num_workers: 4
    pin_memory: true
    drop_last: false

# Model (wrapper returns loss/stats/weight for Lightning)
model:
  _target_: egs3.ami_diar.diar.src.diar_model.DiarizationTrainingModel

  # SSL Frontend - XEUS (requires model_path to checkpoint)
  ssl_model_name: xeus
  ssl_model_path: null  # Set to path of XEUS checkpoint (e.g. from https://huggingface.co/espnet/xeus)
  ssl_freeze: false
  ssl_num_layers: 25   # XEUS: 24 transformer + 1 CNN
  ssl_hidden_size: 1024  # XEUS hidden dim
  ssl_layer_weights: true
  ssl_feature_grad_mult: 0.1  # Lower gradient multiplier for SSL fine-tuning

  # Projection layer (XEUS outputs 1024-dim)
  projection_size: 256

  # Conformer encoder (full size)
  conformer_num_blocks: 4
  conformer_attention_heads: 4
  conformer_ffn_units: 1024
  conformer_kernel_size: 31
  conformer_dropout: 0.1

  # Powerset classification
  num_speakers: 4
  max_speakers_per_frame: 2

  # Training settings
  loss_type: nll
  cardinality_weight_type: uniform

# Optimizer configuration
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]

# Learning rate scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 100
  eta_min: 0.00001

# Lightning Trainer configuration
trainer:
  max_epochs: 20
  accelerator: auto
  devices: 1
  num_nodes: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 8   # effective batch = 2*8 = 16 (same as before, less peak memory)
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false
  precision: 16-mixed

# Logging
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: ${exp_dir}/logs
  name: xeus_full_training
  version: null

# Seed
seed: 42

# Best model selection for checkpoints
best_model_criterion:
  - [valid/loss, 3, min]

# Stats collection
collect_stats: false

# Model saving
save_model:
  save_dir: ${exp_dir}/final_model
  save_filename: model.pth
