# Full training configuration for diarization
# Based on debug.yaml but with full training settings

# Runtime settings
num_device: 1
num_nodes: 1

# Path scaffold (run from egs3/ami_diar/diar)
recipe_dir: .
ami_manifests_dir: /raid/users/popcornell/AMI
data_dir: data/ami_lhotse
exp_tag: full_training
exp_dir: exp/${exp_tag}
stats_dir: ${exp_dir}/stats

# Create dataset: symlink AMI IHM cuts
create_dataset:
  func: egs3.ami_diar.diar.src.symlink_ami.symlink_ami_manifests
  source_dir: ${ami_manifests_dir}
  output_dir: ${data_dir}

# Dataset definition (DataOrganizer format)
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  train:
    - name: train
      dataset:
        _target_: egs3.ami_diar.diar.src.dataset.DiarizationDataset
        manifest_path: ${data_dir}/train_cuts.jsonl.gz
        chunk_duration: 20.0  # 20 seconds per chunk (DiariZen-style)
        chunk_shift: 5.0      # 15 seconds shift = 5 seconds overlap
        frame_shift: 0.02
        max_speakers: 4
        sample_rate: 16000
  valid:
    - name: valid
      dataset:
        _target_: egs3.ami_diar.diar.src.dataset.DiarizationDataset
        manifest_path: ${data_dir}/dev_cuts.jsonl.gz
        chunk_duration: 20.0   # Match training chunk size (can use null for full recordings if GPU allows)
        chunk_shift: 15.0
        frame_shift: 0.02
        max_speakers: 4
        sample_rate: 16000

# DataLoader settings
dataloader:
  collate_fn:
    _target_: egs3.ami_diar.diar.src.dataset.CollateFnWrapper
  train:
    iter_factory: null
    batch_size: 8  # Increased from debug (2)
    shuffle: true
    num_workers: 4  # Increased from debug (0)
    pin_memory: true  # Enable for GPU
    drop_last: true
  valid:
    iter_factory: null
    batch_size: 8
    shuffle: false
    num_workers: 4  # Increased from debug (0)
    pin_memory: true
    drop_last: false

# Model (wrapper returns loss/stats/weight for Lightning)
model:
  _target_: egs3.ami_diar.diar.src.diar_model.DiarizationTrainingModel

  # SSL Frontend - WavLM Large (24 transformer + 1 CNN; use wavlm_base / wavlm_base_plus for smaller)
  ssl_model_name: wavlm_large
  ssl_model_path: null
  ssl_freeze: false  # Unfreeze SSL for full training
  ssl_num_layers: 25   # WavLM Large: 24 transformer + 1 CNN
  ssl_hidden_size: 1024  # WavLM Large hidden dim
  ssl_layer_weights: true
  ssl_feature_grad_mult: 0.01  # Lower gradient multiplier for SSL fine-tuning

  # Projection layer
  projection_size: 256  # Full size (was 128 in debug)

  # Conformer encoder (full size)
  conformer_num_blocks: 4  # Full size (was 2 in debug)
  conformer_attention_heads: 4
  conformer_ffn_units: 1024  # Full size (was 512 in debug)
  conformer_kernel_size: 31
  conformer_dropout: 0.1

  # Powerset classification
  num_speakers: 4
  max_speakers_per_frame: 2

  # Training settings
  loss_type: nll
  cardinality_weight_type: uniform

# Optimizer configuration
# For simplicity, use single optimizer (can use multiple optimizers if needed)
# If SSL is frozen (ssl_freeze: true), only non-SSL parameters are optimized
# If SSL is unfrozen, all parameters use the same optimizer (can fine-tune with lower LR via ssl_feature_grad_mult)
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]

# Learning rate scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 20  # Total epochs
  eta_min: 0.00001

# Lightning Trainer configuration
trainer:
  max_epochs: 20  # Full training (was 5 in debug)
  accelerator: auto
  devices: 1
  num_nodes: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 4
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 50  # More frequent logging (was 10 in debug)
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false
  precision: 16-mixed  # Mixed precision for faster training (was 32 in debug)
  # No limit_train_batches or limit_val_batches - use full dataset

# Logging
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: ${exp_dir}/logs
  name: full_training
  version: null

# Seed
seed: 42

# Best model selection for checkpoints
best_model_criterion:
  - [valid/loss, 3, min]  # Keep top 3 models by validation loss

# Stats collection
collect_stats: false

# Model saving
save_model:
  save_dir: ${exp_dir}/final_model
  save_filename: model.pth
